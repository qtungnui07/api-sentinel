services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SENTINEL_DATABASE_URL=sqlite:////app/data/sentinel.db
      - SENTINEL_CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - SENTINEL_MAX_CONCURRENT_CHECKS=20
    volumes:
      - sentinel-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sentinel-data:
    name: sentinel_data
